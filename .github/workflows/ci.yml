---
name: CI

on:
  push:
  pull_request:

# Сами проверки и сборка образа общие для Go-сервисов и живут в
# co-visionnage/.github (.github/workflows/go-ci.yml и docker-publish.yml).
# Здесь остаётся только то, что относится к этому сервису: деплой.
jobs:
  ci:
    uses: co-visionnage/.github/.github/workflows/go-ci.yml@main
    secrets: inherit

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: co-visionnage/.github/.github/workflows/docker-publish.yml@main

  deploy-production:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ needs.publish.outputs.image-tag }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          ssh "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_PATH && \
             git fetch origin main && \
             git checkout --detach origin/main && \
             export WORKER_IMAGE_TAG=$IMAGE_TAG && \
             docker compose -f docker-compose.prod.yml pull worker && \
             docker compose -f docker-compose.prod.yml up -d --remove-orphans worker && \
             docker image prune -f"
